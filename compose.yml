services:
  mediamtx-ui:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mediamtx-ui
    image: mediamtx-ui
    restart: unless-stopped
    command: ["npm", "start"]
    working_dir: /app/server
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    networks:
      - mediamtx
    volumes:
      - ./:/app
      - /app/server/node_modules
      - /app/frontend/node_modules
    environment:
      - NODE_ENV=production
      - SERVER_PORT=${SERVER_PORT}
      - MEDIAMTX_BASE_URL=http://mediamtx:9997
      # HLS-Base-URL für die UI (Theater/Stream-Wall) — Vite liest VITE_* aus der Prozess-Umgebung.
      - VITE_MEDIAMTX_HLS_URL=${VITE_MEDIAMTX_HLS_URL:-http://localhost:8888}
      - VITE_MEDIAMTX_PLAYBACK_URL=${VITE_MEDIAMTX_PLAYBACK_URL:-http://localhost:9996}
      - MEDIAMTX_LOG_PATH=${MEDIAMTX_LOG_PATH:-../data/mediamtx/mediamtx.log}

networks:
  mediamtx:
    external: false
    name: "mediamtx"
