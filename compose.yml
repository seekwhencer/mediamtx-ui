services:
  mediamtx-ui:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mediamtx-ui
    image: mediamtx-ui
    restart: unless-stopped
    command: ["npm", "start"]
    working_dir: /app/server
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    networks:
      - mediamtx
    volumes:
      - ./:/app
      - /app/server/node_modules
      - /app/frontend/node_modules
    environment:
      - NODE_ENV=production
      - SERVER_PORT=${SERVER_PORT}
      - MEDIAMTX_BASE_URL=http://mediamtx:9997

networks:
  mediamtx:
    external: false
    name: "mediamtx"
