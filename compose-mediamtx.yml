services:
  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION}
    container_name: mediamtx
    restart: unless-stopped
    environment:
      # HLS-Base-URL für die UI (Theater/Stream-Wall) — für MediaMTX selbst ohne Wirkung,
      # hier nur für Konsistenz mit .env / .env.default / compose*.yml.
      - VITE_MEDIAMTX_HLS_URL=${VITE_MEDIAMTX_HLS_URL:-http://localhost:8888}
    ports:
      - "${HLS_PORT}:${HLS_PORT}" 
      - "${RTSP_PORT}:${RTSP_PORT}"
      - "${RTMP_PORT}:${RTMP_PORT}"
      - "${WEBRTC_PORT}:${WEBRTC_PORT}"
      - "${WEBRTC_UDP_PORT}:${WEBRTC_UDP_PORT}/udp"
      - "${METRICS_PORT}:${METRICS_PORT}"
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./data:/data
    networks:
      - mediamtx

networks:
  mediamtx:
    external: false
    name: "mediamtx"
